<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" width="1200" height="630">
  <title>Mochi Pro — $19 once, use forever</title>
  <desc>Product cover for Mochi Pro: wordmark and value pitch on the left, pricing card with the $19 one-time price and feature checklist on the right, matching the live site's neutral + violet design.</desc>

  <defs>
    <radialGradient id="glow2" cx="0%" cy="100%" r="75%">
      <stop offset="0%" stop-color="#6d5ef8" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#6d5ef8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- ===================== LEFT: wordmark + pitch ===================== -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif">
    <text x="80" y="96" font-size="26" font-weight="700" letter-spacing="-0.5" fill="#171717">mochi</text>

    <rect x="80" y="128" width="286" height="34" rx="17" fill="#ffffff" stroke="#e5e5e5"/>
    <circle cx="100" cy="145" r="4" fill="#10b981"/>
    <text x="114" y="150" font-size="13" fill="#171717">Local-first · Peer-to-peer · AI-native</text>

    <text x="78" y="238" font-size="48" font-weight="700" letter-spacing="-1.3" fill="#171717">Mochi Pro</text>
    <text x="78" y="284" font-size="22" fill="#6b7280">Agent-native data workspace</text>
    <text x="78" y="312" font-size="22" fill="#6b7280">for Claude, OpenCode &amp; Hermes-Agent</text>

    <!-- engine chips -->
    <g font-family="ui-sans-serif, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">
      <rect x="78" y="352" width="104" height="28" rx="14" fill="#171717"/>
      <text x="130" y="370" text-anchor="middle">CLAUDE CODE</text>
      <rect x="190" y="352" width="126" height="28" rx="14" fill="#171717"/>
      <text x="253" y="370" text-anchor="middle">CLAUDE DESKTOP</text>
      <rect x="324" y="352" width="84" height="28" rx="14" fill="#171717"/>
      <text x="366" y="370" text-anchor="middle">OPENCODE</text>
      <rect x="416" y="352" width="112" height="28" rx="14" fill="#171717"/>
      <text x="472" y="370" text-anchor="middle">HERMES-AGENT</text>
    </g>

    <text x="78" y="440" font-size="17" fill="#6b7280">One command to install. One-time payment —</text>
    <text x="78" y="464" font-size="17" fill="#6b7280">no subscription, no server bills, ever.</text>

    <rect x="78" y="494" width="520" height="52" rx="14" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="100" y="526" font-family="ui-monospace, 'SF Mono', monospace" font-size="12" fill="#6b7280">$</text>
    <text x="117" y="526" font-family="ui-monospace, 'SF Mono', monospace" font-size="12" fill="#171717">npx --yes github:mochi-cli/mochi#main install claude-code</text>
  </g>

  <!-- ===================== RIGHT: pricing card ===================== -->
  <g transform="translate(700,95)">
    <rect x="-20" y="-16" width="132" height="32" rx="16" fill="#6d5ef8"/>
    <text x="46" y="5" text-anchor="middle" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.3">★ MOST POPULAR</text>

    <rect x="0" y="0" width="420" height="440" rx="20" fill="#ffffff" stroke="#6d5ef8" stroke-width="2.5"/>

    <text x="32" y="56" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#171717">Pro</text>
    <text x="388" y="56" text-anchor="end" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" fill="#6b7280">12 CR</text>

    <text x="32" y="130" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="68" font-weight="700" fill="#171717">$19</text>
    <text x="168" y="130" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="18" fill="#6b7280">/forever</text>
    <text x="32" y="158" font-family="ui-sans-serif, -apple-system, sans-serif" font-size="14" fill="#6b7280">One-time payment. Pay once, use forever.</text>

    <line x1="32" y1="184" x2="388" y2="184" stroke="#e5e5e5"/>

    <g font-family="ui-sans-serif, -apple-system, sans-serif" font-size="16" fill="#171717">
      <g transform="translate(32,216)">
        <path d="M0 5l3.5 3.5L10 0" stroke="#6d5ef8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="24" y="9">Unlimited workspaces</text>
      </g>
      <g transform="translate(32,256)">
        <path d="M0 5l3.5 3.5L10 0" stroke="#6d5ef8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="24" y="9">Mochi Table</text>
      </g>
      <g transform="translate(32,296)">
        <path d="M0 5l3.5 3.5L10 0" stroke="#6d5ef8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="24" y="9">Premium templates</text>
      </g>
      <g transform="translate(32,336)">
        <path d="M0 5l3.5 3.5L10 0" stroke="#6d5ef8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="24" y="9">Git bundle deploy</text>
      </g>
      <g transform="translate(32,376)">
        <path d="M0 5l3.5 3.5L10 0" stroke="#6d5ef8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="24" y="9">Write history &amp; rollback</text>
      </g>
    </g>

    <rect x="32" y="398" width="356" height="4" rx="2" fill="#f7f7f7"/>
  </g>

  <line x1="60" y1="576" x2="1140" y2="576" stroke="#e5e5e5"/>
  <text x="60" y="608" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#6b7280">Your team's data workspace — no server bills, no lock-in, agent-ready.</text>
  <text x="1140" y="608" text-anchor="end" font-family="ui-sans-serif, sans-serif" font-size="14" font-weight="600" fill="#171717">mochi-cli.com</text>
</svg>

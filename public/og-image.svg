<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" width="1200" height="630">
  <title>Mochi — The local-first data workspace for your team and AI agents</title>
  <desc>Product cover: headline on the left with the install command, real product table (Deals) on the right, matching the live site's neutral + violet design.</desc>

  <defs>
    <radialGradient id="glow" cx="100%" cy="100%" r="75%">
      <stop offset="0%" stop-color="#6d5ef8" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#6d5ef8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardClip"><rect x="0" y="0" width="620" height="430" rx="16"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- ===================== LEFT: wordmark, headline, install ===================== -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', sans-serif">
    <text x="72" y="76" font-size="24" font-weight="700" letter-spacing="-0.5" fill="#171717">mochi</text>

    <!-- live badge -->
    <rect x="72" y="108" width="286" height="34" rx="17" fill="#ffffff" stroke="#e5e5e5"/>
    <circle cx="92" cy="125" r="4" fill="#10b981"/>
    <text x="106" y="130" font-size="13" fill="#171717">Local-first · Peer-to-peer · AI-native</text>

    <text x="70" y="198" font-size="42" font-weight="700" letter-spacing="-1.2" fill="#171717">The local-first data</text>
    <text x="70" y="244" font-size="42" font-weight="700" letter-spacing="-1.2" fill="#171717">workspace for your</text>
    <text x="70" y="290" font-size="42" font-weight="700" letter-spacing="-1.2" fill="#171717">team and AI agents.</text>
    <text x="70" y="334" font-size="42" font-weight="700" letter-spacing="-1.2" fill="#6d5ef8">Zero server bills.</text>

    <text x="72" y="378" font-size="17" fill="#6b7280">Build CRM, HR, inventory, or any internal tool — no code, no</text>
    <text x="72" y="400" font-size="17" fill="#6b7280">prompts. Works natively with Claude, OpenCode, and Hermes-Agent.</text>

    <!-- install command -->
    <rect x="72" y="432" width="470" height="54" rx="14" fill="#ffffff" stroke="#e5e5e5"/>
    <text x="94" y="465" font-family="ui-monospace, 'SF Mono', monospace" font-size="11" fill="#6b7280">$</text>
    <text x="112" y="465" font-family="ui-monospace, 'SF Mono', monospace" font-size="11" fill="#171717">npx --yes github:mochi-cli/mochi#main install claude-code</text>

    <!-- engine chips -->
    <g font-family="ui-sans-serif, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#ffffff">
      <rect x="72" y="502" width="104" height="24" rx="12" fill="#171717"/>
      <text x="124" y="518" text-anchor="middle">CLAUDE CODE</text>
      <rect x="184" y="502" width="126" height="24" rx="12" fill="#e5e5e5"/>
      <text x="247" y="518" text-anchor="middle" fill="#6b7280">CLAUDE DESKTOP</text>
      <rect x="318" y="502" width="84" height="24" rx="12" fill="#e5e5e5"/>
      <text x="360" y="518" text-anchor="middle" fill="#6b7280">OPENCODE</text>
      <rect x="410" y="502" width="112" height="24" rx="12" fill="#e5e5e5"/>
      <text x="466" y="518" text-anchor="middle" fill="#6b7280">HERMES-AGENT</text>
    </g>
  </g>

  <!-- ===================== RIGHT: the real product table ===================== -->
  <g transform="translate(560,100)">
    <rect x="0" y="0" width="576" height="430" rx="16" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5"/>
    <g clip-path="url(#cardClip)">
      <!-- window chrome -->
      <rect x="0" y="0" width="576" height="34" fill="#f7f7f7"/>
      <circle cx="20" cy="17" r="6" fill="#ff5f57"/>
      <circle cx="38" cy="17" r="6" fill="#febc2e"/>
      <circle cx="56" cy="17" r="6" fill="#28c840"/>

      <!-- tab strip -->
      <rect x="0" y="34" width="576" height="38" fill="#f7f7f7"/>
      <g font-family="ui-sans-serif, -apple-system, sans-serif" font-size="12" font-weight="600">
        <rect x="14" y="42" width="16" height="16" rx="4" fill="#d1fbe8"/>
        <text x="22" y="54" text-anchor="middle" fill="#047857">C</text>
        <text x="36" y="55" fill="#6b7280">Customers</text>

        <rect x="118" y="40" width="90" height="30" rx="8" fill="#ffffff"/>
        <rect x="124" y="45" width="16" height="16" rx="4" fill="#ede9fe"/>
        <text x="132" y="57" text-anchor="middle" fill="#5b21b6">D</text>
        <text x="146" y="58" fill="#171717">Deals</text>

        <rect x="222" y="42" width="16" height="16" rx="4" fill="#fef3c7"/>
        <text x="230" y="54" text-anchor="middle" fill="#b45309">I</text>
        <text x="244" y="55" fill="#6b7280">Interactions</text>
      </g>

      <!-- toolbar -->
      <rect x="0" y="72" width="576" height="34" fill="#ffffff"/>
      <text x="14" y="93" font-family="ui-sans-serif, sans-serif" font-size="12" font-weight="600" fill="#171717">Grid view</text>
      <rect x="518" y="79" width="46" height="20" rx="6" fill="#171717"/>
      <text x="541" y="93" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10" font-weight="600" fill="#ffffff">+ New</text>

      <!-- header row -->
      <line x1="0" y1="106" x2="576" y2="106" stroke="#e5e5e5"/>
      <g font-family="ui-sans-serif, sans-serif" font-size="10" font-weight="600" fill="#6b7280" letter-spacing="0.4">
        <text x="14" y="122">#</text>
        <text x="40" y="122">COMPANY</text>
        <text x="220" y="122">STAGE</text>
        <text x="340" y="122">OWNER</text>
        <text x="470" y="122">VALUE</text>
      </g>
      <line x1="0" y1="132" x2="576" y2="132" stroke="#e5e5e5"/>

      <!-- rows -->
      <g font-family="ui-sans-serif, sans-serif" font-size="13">
        <text x="14" y="158" fill="#6b7280">1</text>
        <text x="40" y="158" font-weight="600" fill="#171717">VisionQuest Labs</text>
        <rect x="220" y="144" width="76" height="22" rx="11" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="258" y="159" text-anchor="middle" font-size="11" fill="#171717">Discovery</text>
        <text x="340" y="158" fill="#6b7280">James Cooper</text>
        <text x="470" y="158" font-weight="600" fill="#171717">$14,300</text>

        <line x1="0" y1="176" x2="576" y2="176" stroke="#f0f0f0"/>
        <text x="14" y="200" fill="#6b7280">2</text>
        <text x="40" y="200" font-weight="600" fill="#171717">Acetube Inc.</text>
        <rect x="220" y="186" width="86" height="22" rx="11" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="263" y="201" text-anchor="middle" font-size="11" fill="#171717">Negotiation</text>
        <text x="340" y="200" fill="#6b7280">Charlotte King</text>
        <text x="470" y="200" font-weight="600" fill="#171717">$48,200</text>

        <line x1="0" y1="218" x2="576" y2="218" stroke="#f0f0f0"/>
        <text x="14" y="242" fill="#6b7280">3</text>
        <text x="40" y="242" font-weight="600" fill="#171717">LKS Retainer</text>
        <rect x="220" y="228" width="76" height="22" rx="11" fill="#ffffff" stroke="#e5e5e5"/>
        <text x="258" y="243" text-anchor="middle" font-size="11" fill="#171717">Discovery</text>
        <text x="340" y="242" fill="#6b7280">Benjamin Taylor</text>
        <text x="470" y="242" font-weight="600" fill="#171717">$6,500</text>

        <line x1="0" y1="260" x2="576" y2="260" stroke="#f0f0f0"/>
        <text x="14" y="284" fill="#6b7280">4</text>
        <text x="40" y="284" font-weight="600" fill="#171717">Timbershadow</text>
        <rect x="220" y="270" width="82" height="22" rx="11" fill="#d1fbe8"/>
        <text x="261" y="285" text-anchor="middle" font-size="11" fill="#047857">Closed won</text>
        <text x="340" y="284" fill="#6b7280">Casey Park</text>
        <text x="470" y="284" font-weight="600" fill="#171717">$61,540</text>
      </g>

      <!-- status bar -->
      <rect x="0" y="396" width="576" height="34" fill="#f7f7f7"/>
      <text x="14" y="417" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#6b7280">Showing 5</text>
      <circle cx="96" cy="413" r="3.5" fill="#10b981"/>
      <text x="106" y="417" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#6b7280">in sync</text>
    </g>
  </g>

  <line x1="60" y1="576" x2="1140" y2="576" stroke="#e5e5e5"/>
  <text x="60" y="608" font-family="ui-sans-serif, sans-serif" font-size="14" fill="#6b7280">Your team's data workspace — no server bills, no lock-in, agent-ready.</text>
  <text x="1140" y="608" text-anchor="end" font-family="ui-sans-serif, sans-serif" font-size="14" font-weight="600" fill="#171717">mochi-cli.com</text>
</svg>

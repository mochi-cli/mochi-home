<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mochi Table">
  <title>Mochi Table</title>
  <!--
    Generated by scripts/make-icons.js — edit the geometry there, not here.

    A table pressed into a mochi. Monochrome because every colour token in
    styles.css is `oklch(x 0 0)`: the only colour this product shows comes from
    the data itself. Cut rather than stroked, because a drawn grid needs lines
    thinner than a pixel at 16px. A superellipse rather than a rounded rect,
    because the curvature never stops and that is what reads as soft.

    The cells are opaque, not holes — as holes they look identical on a white
    page and vanish on a dark dock.
  -->
  <style>

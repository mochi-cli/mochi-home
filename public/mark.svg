       `currentColor` inherits nothing useful: the file has to know about dark
       mode itself. */
    :root { --body: #0a0a0a; --cell: #ffffff; }
    @media (prefers-color-scheme: dark) { :root { --body: #fafafa; --cell: #0a0a0a; } }
  </style>
